<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MyMoney - Login</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="login-container">

        <div class="logo">
            💰
        </div>

        <h1>MyMoney</h1>
        <p class="subtitle">Secure Money Management</p>

        <form id="loginForm">

            <label>Username</label>
            <input
                type="text"
                id="username"
                placeholder="Enter username"
                required
            >

            <label>Password</label>
            <input
                type="password"
                id="password"
                placeholder="Enter password"
                required
            >

            <button type="submit">
                Login
            </button>

        </form>

        <p id="message"></p>

    </div>

    <script src="script.js"></script>

</body>
</html>
